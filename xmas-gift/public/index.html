<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xmas 盲盒交換禮物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;900&display=swap" rel="stylesheet">
<style>
:root{--pine:#12372a;--pine2:#1b4d3b;--tag:#d7263d;--snow:#f7f5f0;--gold:#e9c46a;--ink:#10231b}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--pine);color:var(--snow);line-height:1.6;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:2.2rem;font-weight:900;margin:0 0 6px;letter-spacing:.02em}
.sub{color:var(--gold);margin:0 0 24px}
section{background:var(--pine2);border-radius:14px;padding:18px;margin-bottom:18px}
h2{font-size:1rem;margin:0 0 10px;font-weight:500;color:var(--gold)}
.rules{margin:0;padding-left:1.2em;font-size:.92rem}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slots button{aspect-ratio:1;border:2px dashed #ffffff55;background:transparent;color:var(--snow);font:900 1.6rem inherit;font-family:inherit;border-radius:12px 12px 12px 12px;cursor:pointer;position:relative}
.slots button.done{border-style:solid;border-color:var(--gold)}
.slots button.done::after{content:"✓";position:absolute;top:2px;right:8px;font-size:.9rem;color:var(--gold)}
.slots button.sel{background:var(--snow);color:var(--ink);border-color:var(--snow)}
label{display:block;font-size:.88rem;margin:12px 0 4px}
input{width:100%;padding:11px 12px;border-radius:8px;border:2px solid transparent;font:inherit;background:var(--snow);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cta{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--tag);color:#fff;font:900 1.05rem inherit;font-family:inherit;cursor:pointer}
.cta:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:2px solid var(--gold);color:var(--gold)}
.msg{min-height:1.4em;margin:10px 0 0;font-size:.9rem}
.err{color:#ffb4bd}
.bar{height:8px;background:#00000040;border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.giftag{background:var(--snow);color:var(--ink);border-radius:6px 28px 6px 6px;padding:26px 20px 22px;text-align:center;position:relative;margin-top:8px}
.giftag::before{content:"";position:absolute;top:12px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--pine)}
.giftag p{margin:18px 0 4px;font-size:.85rem;color:#555}
.giftag b{display:block;font-size:2.1rem;font-weight:900;line-height:1.3;color:var(--tag)}
.small{font-size:.82rem;opacity:.8}
</style>
</head>
<body>
<main>
  <h1>Xmas 盲盒交換禮物</h1>
  <p class="sub">25 Dec 交換 · 預算 約 AUD $50</p>

  <section>
    <h2>玩法</h2>
    <ol class="rules">
      <li>諗一樣你想收到嘅禮物（約 $50 AUD）</li>
      <li>揀你嘅號碼，匿名打 3 個形容詞（質感／形狀／用途／感受 etc）</li>
      <li>全部人交齊後抽籤，你會收到另一個人嘅 3 個形容詞</li>
      <li>根據形容詞去買禮物，25 號交換</li>
    </ol>
    <p class="small" style="margin:10px 0 0">Couple 都有可能抽到對方，所以盡量保密啦。</p>
  </section>

  <section>
    <h2>1. 揀你嘅號碼</h2>
    <div class="slots" id="slots"></div>
    <label for="pin">自設 4 位 PIN（用嚟搵返自己，記住佢）</label>
    <input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="例如 1234">
  </section>

  <section>
    <h2>2. 你想要嘅禮物，3 個形容詞</h2>
    <div class="three">
      <input class="adj" maxlength="20" aria-label="形容詞 1" placeholder="例：軟綿綿">
      <input class="adj" maxlength="20" aria-label="形容詞 2" placeholder="例：圓形">
      <input class="adj" maxlength="20" aria-label="形容詞 3" placeholder="例：暖笠笠">
    </div>
    <button class="cta" id="submit">交出形容詞</button>
    <p class="msg" id="msg1" role="status"></p>
  </section>

  <section>
    <h2>3. 抽籤</h2>
    <div id="progress"></div>
    <div class="bar"><i id="barfill" style="width:0"></i></div>
    <button class="cta ghost" id="reveal" disabled>抽！睇我收到咩形容詞</button>
    <p class="msg" id="msg2" role="status"></p>
    <div id="result"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let slot = null, st = { n: 8, done: [], drawn: false };
try { slot = +localStorage.getItem('xg_slot') || null; $('#pin').value = localStorage.getItem('xg_pin') || ''; } catch (e) {}

async function api(body) {
  const r = await fetch('/api/gift', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '出事');
  return j;
}
const creds = () => ({ slot, pin: $('#pin').value.trim() });
function say(id, t, bad) { const e = $(id); e.textContent = t; e.className = 'msg' + (bad ? ' err' : ''); }

function render() {
  const box = $('#slots'); box.innerHTML = '';
  for (let i = 1; i <= st.n; i++) {
    const b = document.createElement('button');
    b.textContent = i;
    b.className = (st.done.includes(i) ? 'done ' : '') + (slot === i ? 'sel' : '');
    b.setAttribute('aria-label', '號碼 ' + i + (st.done.includes(i) ? '（已提交）' : ''));
    b.onclick = () => { slot = i; try { localStorage.setItem('xg_slot', i); } catch (e) {} render(); };
    box.appendChild(b);
  }
  $('#progress').textContent = st.done.length + ' / ' + st.n + ' 人已提交';
  $('#barfill').style.width = (st.done.length / st.n * 100) + '%';
  const all = st.done.length >= st.n;
  $('#reveal').disabled = !(all && slot && /^\d{4}$/.test($('#pin').value));
  $('#reveal').textContent = st.drawn ? '睇返我收到嘅形容詞' : (all ? '抽！睇我收到咩形容詞' : '等齊人先抽到');
}
function apply(j) {
  st = j;
  if (j.mine) document.querySelectorAll('.adj').forEach((el, i) => (el.value = j.mine[i]));
  if (j.got) showResult(j.got);
  render();
}
function showResult(a) {
  const r = $('#result'); r.innerHTML = '';
  const t = document.createElement('div'); t.className = 'giftag';
  const p = document.createElement('p'); p.textContent = '你要買嘅禮物係…';
  t.appendChild(p);
  a.forEach((w) => { const b = document.createElement('b'); b.textContent = w; t.appendChild(b); });
  const s = document.createElement('p'); s.textContent = '預算約 $50 AUD · 25 號交換';
  t.appendChild(s); r.appendChild(t);
}
async function refresh() {
  try { apply(await api({ action: 'status', ...(slot ? creds() : {}) })); } catch (e) { say('#msg2', e.message, 1); }
}

$('#submit').onclick = async () => {
  if (!slot) return say('#msg1', '請先揀號碼', 1);
  const adjs = [...document.querySelectorAll('.adj')].map((e) => e.value);
  try {
    try { localStorage.setItem('xg_pin', $('#pin').value); } catch (e) {}
    apply(await api({ action: 'submit', ...creds(), adjs }));
    say('#msg1', '已交！之後可以改，直到抽籤為止。');
  } catch (e) { say('#msg1', e.message, 1); }
};
$('#reveal').onclick = async () => {
  try { apply(await api({ action: 'reveal', ...creds() })); say('#msg2', ''); } catch (e) { say('#msg2', e.message, 1); }
};
$('#pin').oninput = render;
refresh(); setInterval(refresh, 20000);
</script>
</body>
</html>
